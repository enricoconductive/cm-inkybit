name: MakeCode extension

on:
  push:
    branches:
      - master
      - feature/inkybit-image-editor-v1
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the pinned Node.js release
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the locked toolchain
        run: npm ci

      - name: Verify the stable image fixture
        run: npm run verify:default-image

      - name: Test the native IBIT loader
        run: npm run test:native-loader

      - name: Compile against the pinned public target
        run: npm run test:extension
